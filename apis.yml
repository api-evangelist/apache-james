aid: apache-james
name: Apache James
description: Apache James (Java Apache Mail Enterprise Server) is a portable and enterprise-ready mail server built entirely
  in Java. It implements SMTP, IMAP, POP3, and JMAP protocols and provides a modular architecture with a comprehensive administration
  REST API and Cassandra-backed distributed deployment.
